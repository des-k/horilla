{% load i18n %}
<div class="oh-card">
    <div class="oh-card__header">
        <h3 class="oh-card__title mb-0">{% trans "Face Detection" %}</h3>
    </div>
    <div class="oh-card__body">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div>
                <label class="oh-input__label d-block mb-1" for="faceDetectionAlwaysOn">
                    {% trans "Enable Face Detection" %}
                </label>
                <p class="text-muted mb-0">
                    {% trans "Always enabled for attendance. This setting is managed by the system and cannot be changed here." %}
                </p>
            </div>
            <div class="d-flex align-items-center gap-2">
                <span class="fw-medium">
                    {% if facedetection.start %}{% trans "Enabled" %}{% else %}{% trans "Disabled" %}{% endif %}
                </span>
                <div class="oh-switch" title="{% trans 'Face Detection is always active and cannot be changed.' %}">
                    <input
                        id="faceDetectionAlwaysOn"
                        type="checkbox"
                        class="oh-switch__checkbox"
                        {% if facedetection.start %}checked{% endif %}
                        disabled
                        aria-label="{% trans 'Face Detection is enabled and read only' %}"
                    >
                </div>
            </div>
        </div>
    </div>
</div>


<div class="oh-card mt-3">
    <div class="oh-card__header">
        <h3 class="oh-card__title mb-0">{% trans "Face Detection" %}</h3>
    </div>
    <div class="oh-card__body">
        <div class="row g-3">
            <div class="col-md-6">
                <form method="post">
                    {% csrf_token %}
                    <input type="hidden" name="action" value="reset_face">
                    <label class="oh-input__label" for="resetFaceEmployee">{% trans "Reset Face Detection For" %}</label>
                    <select class="oh-input w-100" id="resetFaceEmployee" name="employee_id" required>
                        <option value="">{% trans "Select employee" %}</option>
                        {% for emp in employees %}
                        <option value="{{ emp.id }}">{{ emp }}</option>
                        {% endfor %}
                    </select>
                    <button class="oh-btn oh-btn--secondary mt-2" type="submit">{% trans "Apply Face Reset" %}</button>
                </form>
            </div>
        </div>
    </div>
</div>
