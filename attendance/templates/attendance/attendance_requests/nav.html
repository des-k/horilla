{% load i18n %}

<style>
  .oh-attendance-request-filter-grid {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    width: 100%;
  }

  .oh-attendance-request-filter-grid .oh-input-group {
    margin: 0;
  }

  .oh-attendance-request-filter-grid .oh-attendance-request-filter-month {
    flex: 0 0 170px;
    min-width: 170px;
  }

  .oh-attendance-request-filter-grid .oh-attendance-request-filter-status {
    flex: 0 0 165px;
    min-width: 165px;
  }

  .oh-attendance-request-filter-grid .oh-input,
  .oh-attendance-request-filter-grid .oh-select,
  .oh-attendance-request-filter-grid .oh-btn {
    min-height: 34px;
    height: 34px;
    box-sizing: border-box;
  }

  .oh-attendance-request-filter-grid .oh-input,
  .oh-attendance-request-filter-grid .oh-select {
    width: 100%;
    padding-top: 0;
    padding-bottom: 0;
  }

  .oh-attendance-request-filter-grid .oh-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
    padding: 0 12px;
    line-height: 1;
  }

  .oh-attendance-request-filter-grid .oh-attendance-request-filter-actions {
    display: flex;
    flex-wrap: nowrap;
    align-items: center;
    gap: 8px;
    margin-left: auto;
    flex: 0 0 auto;
  }

  @media (max-width: 991.98px) {
    .oh-attendance-request-filter-grid {
      justify-content: flex-start;
    }

    .oh-attendance-request-filter-grid .oh-attendance-request-filter-month,
    .oh-attendance-request-filter-grid .oh-attendance-request-filter-status {
      flex: 1 1 180px;
      min-width: 180px;
    }

    .oh-attendance-request-filter-grid .oh-attendance-request-filter-actions {
      margin-left: 0;
      width: 100%;
      justify-content: flex-start;
    }
  }
</style>

<section class="oh-wrapper oh-main__topbar">
  <div class="oh-main__titlebar oh-main__titlebar--left">
    <h1 class="oh-main__titlebar-title fw-bold">{% trans "Attendance Requests" %}</h1>
  </div>

  <div class="oh-main__titlebar oh-main__titlebar--right">
    <form method="get" action="{% url 'request-attendance-view' %}" class="oh-attendance-request-filter-grid" onsubmit="event.preventDefault(); this.submit();">
      <div class="oh-input-group oh-attendance-request-filter-month">
        <input
          type="month"
          class="oh-input"
          name="my_month"
          aria-label="{% trans 'Month' %}"
          value="{{ my_month }}"
          onchange="this.form.submit()"
        />
      </div>

      <div class="oh-input-group oh-attendance-request-filter-status">
        <select class="oh-select" name="status_my" aria-label="{% trans 'Status' %}" onchange="this.form.submit()">
          {% for v, label in status_my_options %}
            <option value="{{ v }}" {% if status_my == v %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="oh-main__titlebar-button-container oh-attendance-request-filter-actions">
        <button class="oh-btn oh-btn--secondary" data-toggle="oh-modal-toggle" data-target="#objectCreateModal"
          hx-get="{% url 'request-new-attendance' %}" hx-target="#objectCreateModalTarget" onclick="event.preventDefault()">
          <ion-icon name="add-sharp" class="mr-1"></ion-icon>{% trans "Create" %}
        </button>

        <a class="oh-btn oh-btn--light-bkg" href="{% url 'request-attendance-view' %}?my_month={{ my_month }}" title="{% trans 'Reset filters' %}">
          <ion-icon name="refresh-outline" class="mr-1"></ion-icon>{% trans "Reset" %}
        </a>
      </div>
    </form>
  </div>
</section>

{# Modal: Request Details (diff view) #}
<div class="oh-modal" id="validateAttendanceRequest" role="dialog" aria-labelledby="validateAttendanceRequest" aria-hidden="true">
  <div class="oh-modal__dialog">
    <div class="oh-modal__dialog-header">
      <h2 class="oh-modal__dialog-title">{% trans "Attendance Request" %}</h2>
      <button class="oh-modal__close" aria-label="Close">
        <ion-icon name="close-outline"></ion-icon>
      </button>
    </div>
    <div class="oh-modal__dialog-body oh-modal__dialog-relative" id="validateAttendanceRequestModalBody"></div>
  </div>
</div>

{# Modal: Edit Request (optional, reused from existing endpoint) #}
<div class="oh-modal" id="editValidateAttendanceRequest" role="dialog" aria-labelledby="editValidateAttendanceRequest" aria-hidden="true">
  <div class="oh-modal__dialog" id="editValidateAttendanceRequestModalTarget"></div>
</div>

{# Modal: Attachments #}
<div class="oh-modal" id="attendanceRequestAttachmentsModal" role="dialog" aria-labelledby="attendanceRequestAttachmentsModal" aria-hidden="true">
  <div class="oh-modal__dialog" id="attendanceRequestAttachmentsModalTarget"></div>
</div>


<div class="oh-modal" id="attendanceRequestRejectModal" role="dialog" aria-labelledby="attendanceRequestRejectModal" aria-hidden="true">
  <div class="oh-modal__dialog">
    <div class="oh-modal__dialog-body" id="attendanceRequestRejectModalBody"></div>
  </div>
</div>
