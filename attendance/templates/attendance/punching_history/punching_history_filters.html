{% load i18n %}
<form method="get" class="mb-3">
  <div class="oh-card">
    <div class="oh-card__body">
      <div class="ph-filter-grid">
        <div class="ph-field">
          <label class="oh-input__label">{% trans "Employee" %}</label>
          {% if show_employee_filter %}
            <select name="employee_id" class="oh-select oh-select-2 w-100">
              <option value="" {% if not punch_filter_data.employee_id %}selected{% endif %}>
                {% trans "All Employees" %}
              </option>
              {% for employee in employee_options %}
                <option
                  value="{{ employee.id }}"
                  {% if punch_filter_data.employee_id|stringformat:"s" == employee.id|stringformat:"s" %}selected{% endif %}
                >
                  {{ employee }}
                </option>
              {% endfor %}
            </select>
          {% else %}
            <input type="hidden" name="employee_id" value="{{ punch_filter_data.employee_id|default:selected_scope_employee.id }}">
            <input type="text" class="oh-input w-100" value="{{ selected_scope_employee|default:"" }}" readonly>
          {% endif %}
        </div>

        <div class="ph-field">
          <label class="oh-input__label">{% trans "Start Date" %}</label>
          <input
            type="date"
            name="punch_date_from"
            class="oh-input w-100"
            value="{{ punch_filter_data.punch_date_from|default:'' }}"
          >
        </div>

        <div class="ph-field">
          <label class="oh-input__label">{% trans "End Date" %}</label>
          <input
            type="date"
            name="punch_date_till"
            class="oh-input w-100"
            value="{{ punch_filter_data.punch_date_till|default:'' }}"
          >
        </div>

        <div class="ph-filter-actions">
          <button type="submit" class="oh-btn oh-btn--secondary">
            {% trans "Apply" %}
          </button>
          <a href="{% url 'attendance-punching-history-view' %}" class="oh-btn oh-btn--light">
            {% trans "Reset" %}
          </a>
        </div>
      </div>
    </div>
  </div>
</form>
