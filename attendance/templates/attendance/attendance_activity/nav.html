{% load i18n %} {% load basefilters %}
<style>
    .attendance-activity-page {
        padding-top: 16px;
    }
    .attendance-activity-page .oh-main__titlebar {
        margin-bottom: 16px;
    }
    .attendance-activity-page .ph-filter-grid {
        display: grid;
        grid-template-columns: minmax(260px, 1.5fr) minmax(180px, 1fr) minmax(180px, 1fr) auto;
        gap: 12px;
        align-items: end;
    }
    .attendance-activity-page .ph-filter-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-start;
        align-items: center;
    }
    .attendance-activity-page .ph-filter-actions .oh-btn {
        min-width: 96px;
    }
    .attendance-activity-page .ph-field .oh-label,
    .attendance-activity-page .ph-field .oh-input__label {
        display: block;
        margin-bottom: 6px;
    }
    .attendance-activity-page .ph-field .oh-input,
    .attendance-activity-page .ph-field .oh-select,
    .attendance-activity-page .ph-field input[type="date"] {
        min-height: 42px;
    }
    .attendance-activity-page .ph-field .select2-container .select2-selection--single {
        min-height: 42px !important;
        display: flex;
        align-items: center;
    }
    .attendance-activity-page .ph-field .select2-container--default .select2-selection--single .select2-selection__rendered {
        line-height: 40px !important;
    }
    .attendance-activity-page .ph-field .select2-container--default .select2-selection--single .select2-selection__arrow {
        height: 40px !important;
    }
    @media (max-width: 991px) {
        .attendance-activity-page .ph-filter-grid {
            grid-template-columns: 1fr 1fr;
        }
    }
    @media (max-width: 640px) {
        .attendance-activity-page .ph-filter-grid {
            grid-template-columns: 1fr;
        }
    }
</style>
<section class="oh-wrapper attendance-activity-page">
    <form hx-get="{% url 'attendance-activity-search' %}" id="filterForm" hx-swap="innerHTML"
        hx-target="#activity-table" onsubmit="event.preventDefault()">
        <div class="oh-main__titlebar oh-main__titlebar--left">
            <h1 class="oh-main__titlebar-title fw-bold">
                <a href="{% url 'attendance-activity-view' %}" class='text-dark'>
                    {% trans "Attendance Activity" %}
                </a>
            </h1>
        </div>

        {% include 'attendance/attendance_activity/activity_filters.html' %}
    </form>
</section>
